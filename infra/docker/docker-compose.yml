# Servicios de desarrollo: docker compose -f infra/docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: naturalspa
      POSTGRES_PASSWORD: naturalspa
      POSTGRES_DB: naturalspa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturalspa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web

volumes:
  pgdata:
