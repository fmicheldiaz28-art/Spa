name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: naturalspa
          POSTGRES_PASSWORD: naturalspa
          POSTGRES_DB: naturalspa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U naturalspa"
          --health-interval 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://naturalspa:naturalspa@localhost:5432/naturalspa
      JWT_SECRET: ci-secret-with-at-least-thirty-two-characters!!
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Migraciones y seed sobre una base limpia
        working-directory: apps/api
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed   # el seed debe ser idempotente
