<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2a24" />
    <title>Sin conexión · NaturalSpa</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f8f6; --text: #1f2a24; --muted: #5b665f; --primary: #3f7d5c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141a17; --text: #e7ece9; --muted: #9aa69f; --primary: #7fbf9a; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 1.25rem; }
      button { font: inherit; border: 0; border-radius: 0.5rem; padding: 0.6rem 1.2rem; background: var(--primary); color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos con NaturalSpa. Revisa tu internet; la agenda se actualiza sola al volver.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
    <script>window.addEventListener('online', () => location.reload());</script>
  </body>
</html>
